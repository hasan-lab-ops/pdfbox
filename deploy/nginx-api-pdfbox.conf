# /etc/nginx/sites-available/api-pdfbox.online
# Reverse proxy for the dedicated API subdomain -> local FastAPI on :8000.
#
# Install:
#   sudo cp deploy/nginx-api-pdfbox.conf /etc/nginx/sites-available/api-pdfbox.online
#   sudo ln -s /etc/nginx/sites-available/api-pdfbox.online /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Note: the converter API is a plain HTTP/1.1 JSON + file-upload service — it
# has no WebSocket endpoints, so no ws upgrade parameters are needed. The
# upload-related tuning is client_max_body_size + the proxy timeouts below.

# --- HTTP -> HTTPS redirect -------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.pdfbox.online www.api.pdfbox.online;
    return 301 https://$host$request_uri;
}

# --- HTTPS -------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.pdfbox.online www.api.pdfbox.online;

    ssl_certificate     /etc/letsencrypt/live/api.pdfbox.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.pdfbox.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Uploads: API hard limit is 20 MB — allow a small margin for the
    # multipart boundary overhead.
    client_max_body_size 25m;
    client_body_buffer_size 128k;
    client_body_timeout 60s;

    # Uptime probe
    location = /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
        add_header Cache-Control "no-store" always;
    }

    # Conversion endpoint (everything else is ignored by the API anyway)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stream the upload straight to the API (no temp disk buffering)
        proxy_request_buffering off;

        # Conversions of large PDFs can take a while — give them room.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        add_header Cache-Control "no-store" always;
    }
}
