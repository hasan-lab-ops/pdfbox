# Snippet for the MAIN site's existing nginx server block (pdfbox.online)
# -----------------------------------------------------------------------
# The frontend on https://www.pdfbox.online calls the SAME-ORIGIN /convert
# endpoint (fetch("/convert")), so the main vhost must forward /convert and
# /health to the local API. Add these two locations INSIDE the existing
# `server { ... }` block of pdfbox.online, then:
#
#   sudo nginx -t && sudo systemctl reload nginx

# Uptime probe used by the frontend health check
location = /health {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    access_log off;
    add_header Cache-Control "no-store" always;
}

# PDF -> Word conversion (same origin for the frontend)
location = /convert {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 20 MB API limit + multipart overhead
    client_max_body_size 25m;
    proxy_request_buffering off;

    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    add_header Cache-Control "no-store" always;
}
