<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF to Word Converter | PDFBox</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --error-bg: #450a0a;
      --error-border: #dc2626;
      --error-text: #fca5a5;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .converter-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 580px;
      padding: 32px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    }

    .converter-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .converter-header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .converter-header p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* Dropzone */
    .dropzone {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 36px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      background: rgba(15, 23, 42, 0.4);
    }

    .dropzone:hover, .dropzone.dragover {
      border-color: var(--primary);
      background: rgba(79, 70, 229, 0.08);
    }

    .dropzone-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 12px;
      color: var(--primary);
    }

    .dropzone-text {
      font-size: 0.95rem;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .dropzone-subtext {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* File Preview */
    .file-preview {
      display: none;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      margin-top: 16px;
    }

    .file-details {
      display: flex;
      align-items: center;
      gap: 12px;
      overflow: hidden;
    }

    .file-icon {
      color: #ef4444;
      flex-shrink: 0;
    }

    .file-info {
      overflow: hidden;
    }

    .file-name {
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-size {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .btn-remove {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
    }

    .btn-remove:hover {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.1);
    }

    /* Buttons */
    .btn-convert {
      width: 100%;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s ease;
    }

    .btn-convert:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .btn-convert:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Progress & Status */
    .progress-container {
      display: none;
      margin-top: 20px;
    }

    .progress-bar-bg {
      height: 8px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: var(--primary);
      transition: width 0.3s ease;
    }

    .status-text {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 8px;
      text-align: center;
    }

    /* Alert Banner */
    .alert {
      display: none;
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
    }

    .alert-error {
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
    }

    .alert-success {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid var(--success);
      color: #6ee7b7;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid #ffffff;
      border-bottom-color: transparent;
      border-radius: 50%;
      display: inline-block;
      animation: rotation 1s linear infinite;
    }

    @keyframes rotation {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="converter-card">
    <div class="converter-header">
      <h1>Convert PDF to Word</h1>
      <p>Retain fonts, colors, formatting, images, and tables</p>
    </div>

    <!-- Dropzone Area -->
    <div class="dropzone" id="dropzone">
      <svg class="dropzone-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
        <polyline points="17 8 12 3 7 8" />
        <line x1="12" y1="2" x2="12" y2="15" />
      </svg>
      <div class="dropzone-text">Click to choose a file or drag & drop</div>
      <div class="dropzone-subtext">PDF files only (up to 50 MB)</div>
      <input type="file" id="file-input" accept=".pdf,application/pdf" style="display: none;" />
    </div>

    <!-- Selected File Preview -->
    <div class="file-preview" id="file-preview">
      <div class="file-details">
        <svg class="file-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
          <polyline points="14 2 14 8 20 8" />
        </svg>
        <div class="file-info">
          <div class="file-name" id="preview-filename">document.pdf</div>
          <div class="file-size" id="preview-filesize">0 KB</div>
        </div>
      </div>
      <button class="btn-remove" id="btn-remove" title="Remove file">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- Progress Indicator -->
    <div class="progress-container" id="progress-container">
      <div class="progress-bar-bg">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <div class="status-text" id="status-text">Uploading PDF...</div>
    </div>

    <!-- Status Alert -->
    <div class="alert" id="alert-banner"></div>

    <!-- Action Button -->
    <button class="btn-convert" id="btn-convert" disabled>
      <span>Convert to Word (.docx)</span>
    </button>
  </div>

  <script>
    // Configuration
    const API_ENDPOINT = '/convert'; // Proxied via Nginx or direct API URL
    const MAX_SIZE_MB = 50;

    // Elements
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('file-input');
    const filePreview = document.getElementById('file-preview');
    const previewFilename = document.getElementById('preview-filename');
    const previewFilesize = document.getElementById('preview-filesize');
    const btnRemove = document.getElementById('btn-remove');
    const btnConvert = document.getElementById('btn-convert');
    const progressContainer = document.getElementById('progress-container');
    const progressBar = document.getElementById('progress-bar');
    const statusText = document.getElementById('status-text');
    const alertBanner = document.getElementById('alert-banner');

    let selectedFile = null;

    // Trigger File Picker
    dropzone.addEventListener('click', () => fileInput.click());

    // Drag & Drop Handlers
    ['dragenter', 'dragover'].forEach(event => {
      dropzone.addEventListener(event, (e) => {
        e.preventDefault();
        dropzone.classList.add('dragover');
      });
    });

    ['dragleave', 'drop'].forEach(event => {
      dropzone.addEventListener(event, (e) => {
        e.preventDefault();
        dropzone.classList.remove('dragover');
      });
    });

    dropzone.addEventListener('drop', (e) => {
      if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        handleFileSelect(e.dataTransfer.files[0]);
      }
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files.length > 0) {
        handleFileSelect(e.target.files[0]);
      }
    });

    btnRemove.addEventListener('click', resetSelection);

    function formatBytes(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function showAlert(message, type = 'error') {
      alertBanner.textContent = message;
      alertBanner.className = `alert ${type === 'error' ? 'alert-error' : 'alert-success'}`;
      alertBanner.style.display = 'block';
    }

    function hideAlert() {
      alertBanner.style.display = 'none';
      alertBanner.textContent = '';
    }

    function handleFileSelect(file) {
      hideAlert();

      if (!file.name.toLowerCase().endsWith('.pdf')) {
        showAlert('Invalid file type. Please select a valid .pdf file.');
        resetSelection();
        return;
      }

      if (file.size > MAX_SIZE_MB * 1024 * 1024) {
        showAlert(`File is too large. Maximum allowable size is ${MAX_SIZE_MB} MB.`);
        resetSelection();
        return;
      }

      selectedFile = file;
      previewFilename.textContent = file.name;
      previewFilesize.textContent = formatBytes(file.size);

      dropzone.style.display = 'none';
      filePreview.style.display = 'flex';
      btnConvert.disabled = false;
    }

    function resetSelection() {
      selectedFile = null;
      fileInput.value = '';
      filePreview.style.display = 'none';
      dropzone.style.display = 'block';
      btnConvert.disabled = true;
      progressContainer.style.display = 'none';
      progressBar.style.width = '0%';
    }

    // Convert & Download Handler
    btnConvert.addEventListener('click', async () => {
      if (!selectedFile) return;

      hideAlert();
      btnConvert.disabled = true;
      btnConvert.innerHTML = '<span class="spinner"></span> Converting...';
      progressContainer.style.display = 'block';
      progressBar.style.width = '25%';
      statusText.textContent = 'Uploading PDF...';

      const formData = new FormData();
      formData.append('file', selectedFile);

      try {
        // Step 1: Processing Progress Feedback
        setTimeout(() => {
          progressBar.style.width = '65%';
          statusText.textContent = 'Extracting layout, tables & formatting...';
        }, 800);

        const response = await fetch(API_ENDPOINT, {
          method: 'POST',
          body: formData,
        });

        if (!response.ok) {
          let errorMsg = 'Failed to convert document.';
          try {
            const errData = await response.json();
            if (errData && errData.detail) errorMsg = errData.detail;
          } catch (_) {
            errorMsg = `Server error (HTTP ${response.status})`;
          }
          throw new Error(errorMsg);
        }

        progressBar.style.width = '90%';
        statusText.textContent = 'Preparing Word document download...';

        // Extract filename from Content-Disposition header if present
        let downloadName = selectedFile.name.replace(/\.[^/.]+$/, "") + ".docx";
        const disposition = response.headers.get('Content-Disposition');
        if (disposition && disposition.includes('filename=')) {
          const match = disposition.match(/filename="?([^"]+)"?/);
          if (match && match[1]) downloadName = match[1];
        }

        // Receive File Stream as Blob
        const blob = await response.blob();
        progressBar.style.width = '100%';
        statusText.textContent = 'Download starting!';

        // Trigger Browser File Download
        const downloadUrl = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = downloadName;
        document.body.appendChild(a);
        a.click();
        a.remove();
        window.URL.revokeObjectURL(downloadUrl);

        showAlert('Conversion complete! Your download has started.', 'success');
      } catch (err) {
        showAlert(err.message || 'An unexpected error occurred during conversion.');
      } finally {
        btnConvert.disabled = false;
        btnConvert.innerHTML = '<span>Convert to Word (.docx)</span>';
        setTimeout(() => {
          progressContainer.style.display = 'none';
          progressBar.style.width = '0%';
        }, 3000);
      }
    });
  </script>
</body>
</html>
