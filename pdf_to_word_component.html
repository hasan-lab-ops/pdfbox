<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF to Word Converter | PDF BOX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #020812;
      --card-bg: #0F1A35;
      --card-inner: #0A1224;
      --border: #1A2D50;
      --border-glow: rgba(0, 229, 255, 0.25);
      --text: #E8F4FF;
      --text-muted: #8BB4CC;
      --text-dim: #4A7090;
      --accent: #00E5FF;
      --accent-mid: #00BCD4;
      --accent-grad: linear-gradient(135deg, #00E5FF 0%, #00BCD4 100%);
      --accent-glow: rgba(0, 229, 255, 0.12);
      --danger: #ef4444;
      --danger-bg: #450a0a;
      --danger-border: #dc2626;
      --danger-text: #fca5a5;
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.12);
      --success-border: #10b981;
      --success-text: #6ee7b7;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }

    .converter-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 580px;
      padding: 36px;
      box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.7), 0 0 40px rgba(0, 229, 255, 0.05);
      position: relative;
    }

    .converter-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: var(--accent-grad);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    }

    .converter-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .converter-header h1 {
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      color: var(--text);
    }

    .converter-header p {
      color: var(--text-muted);
      font-size: 0.92rem;
    }

    /* Dropzone */
    .dropzone {
      border: 2px dashed var(--border);
      border-radius: var(--radius-md);
      padding: 40px 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      background: var(--card-inner);
    }

    .dropzone:hover, .dropzone.dragover {
      border-color: var(--accent);
      background: var(--accent-glow);
      box-shadow: 0 0 24px rgba(0, 229, 255, 0.1);
      transform: translateY(-2px);
    }

    .dropzone-icon {
      width: 52px;
      height: 52px;
      margin: 0 auto 14px;
      color: var(--accent);
    }

    .dropzone-text {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }

    .dropzone-subtext {
      font-size: 0.82rem;
      color: var(--text-dim);
    }

    /* File Preview */
    .file-preview {
      display: none;
      align-items: center;
      justify-content: space-between;
      background: var(--card-inner);
      border: 1px solid var(--border-glow);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      margin-top: 16px;
    }

    .file-details {
      display: flex;
      align-items: center;
      gap: 14px;
      overflow: hidden;
    }

    .file-icon {
      color: var(--danger);
      flex-shrink: 0;
    }

    .file-info {
      overflow: hidden;
    }

    .file-name {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-size {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .btn-remove {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      padding: 6px;
      border-radius: var(--radius-sm);
      transition: all 0.2s ease;
    }

    .btn-remove:hover {
      color: var(--danger);
      background: rgba(239, 68, 68, 0.15);
    }

    /* Buttons */
    .btn-convert {
      width: 100%;
      background: var(--accent-grad);
      color: #020812;
      border: none;
      border-radius: var(--radius-md);
      padding: 15px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 20px rgba(0, 229, 255, 0.25);
    }

    .btn-convert:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(0, 229, 255, 0.4);
      filter: brightness(1.08);
    }

    .btn-convert:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    /* Progress & Status */
    .progress-container {
      display: none;
      margin-top: 20px;
    }

    .progress-bar-bg {
      height: 8px;
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: var(--accent-grad);
      border-radius: 99px;
      transition: width 0.35s ease;
    }

    .status-text {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 10px;
      text-align: center;
    }

    /* Alert Banner */
    .alert {
      display: none;
      margin-top: 18px;
      padding: 14px 18px;
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .alert-error {
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: var(--danger-text);
    }

    .alert-success {
      background: var(--success-bg);
      border: 1px solid var(--success-border);
      color: var(--success-text);
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2.5px solid #020812;
      border-bottom-color: transparent;
      border-radius: 50%;
      display: inline-block;
      animation: rotation 0.9s linear infinite;
    }

    @keyframes rotation {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="converter-card">
    <div class="converter-header">
      <h1>Convert PDF to Word</h1>
      <p>Preserve fonts, formatting, tables, and images accurately</p>
    </div>

    <!-- Drag & Drop Zone -->
    <div class="dropzone" id="dropzone">
      <svg class="dropzone-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
        <polyline points="17 8 12 3 7 8" />
        <line x1="12" y1="2" x2="12" y2="15" />
      </svg>
      <div class="dropzone-text">Click to choose a file or drag & drop</div>
      <div class="dropzone-subtext">PDF documents up to 20 MB</div>
      <input type="file" id="file-input" accept=".pdf,application/pdf" style="display: none;" />
    </div>

    <!-- Selected File Preview Badge -->
    <div class="file-preview" id="file-preview">
      <div class="file-details">
        <svg class="file-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
          <polyline points="14 2 14 8 20 8" />
        </svg>
        <div class="file-info">
          <div class="file-name" id="preview-filename">document.pdf</div>
          <div class="file-size" id="preview-filesize">0 KB</div>
        </div>
      </div>
      <button class="btn-remove" id="btn-remove" title="Remove file">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- Conversion Progress Indicator -->
    <div class="progress-container" id="progress-container">
      <div class="progress-bar-bg">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <div class="status-text" id="status-text">Uploading PDF...</div>
    </div>

    <!-- Status Alert Banner -->
    <div class="alert" id="alert-banner"></div>

    <!-- Primary Action Button -->
    <button class="btn-convert" id="btn-convert" disabled>
      <span>Convert to Word (.docx)</span>
    </button>
  </div>

  <script>
    // Configuration
    const API_ENDPOINT = '/convert'; // Proxied via Nginx or absolute API URL
    const MAX_SIZE_MB = 20;

    // DOM Elements
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('file-input');
    const filePreview = document.getElementById('file-preview');
    const previewFilename = document.getElementById('preview-filename');
    const previewFilesize = document.getElementById('preview-filesize');
    const btnRemove = document.getElementById('btn-remove');
    const btnConvert = document.getElementById('btn-convert');
    const progressContainer = document.getElementById('progress-container');
    const progressBar = document.getElementById('progress-bar');
    const statusText = document.getElementById('status-text');
    const alertBanner = document.getElementById('alert-banner');

    let selectedFile = null;

    // Trigger File Picker on Click
    dropzone.addEventListener('click', () => fileInput.click());

    // Drag & Drop Listeners
    ['dragenter', 'dragover'].forEach(event => {
      dropzone.addEventListener(event, (e) => {
        e.preventDefault();
        dropzone.classList.add('dragover');
      });
    });

    ['dragleave', 'drop'].forEach(event => {
      dropzone.addEventListener(event, (e) => {
        e.preventDefault();
        dropzone.classList.remove('dragover');
      });
    });

    dropzone.addEventListener('drop', (e) => {
      if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        handleFileSelect(e.dataTransfer.files[0]);
      }
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files.length > 0) {
        handleFileSelect(e.target.files[0]);
      }
    });

    btnRemove.addEventListener('click', resetSelection);

    function formatBytes(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function showAlert(message, type = 'error') {
      alertBanner.textContent = message;
      alertBanner.className = `alert ${type === 'error' ? 'alert-error' : 'alert-success'}`;
      alertBanner.style.display = 'block';
    }

    function hideAlert() {
      alertBanner.style.display = 'none';
      alertBanner.textContent = '';
    }

    function handleFileSelect(file) {
      hideAlert();

      if (!file.name.toLowerCase().endsWith('.pdf')) {
        showAlert('Invalid file type. Please select a document ending in .pdf');
        resetSelection();
        return;
      }

      if (file.size > MAX_SIZE_MB * 1024 * 1024) {
        showAlert(`File is too large (${formatBytes(file.size)}). Maximum allowable size is ${MAX_SIZE_MB} MB.`);
        resetSelection();
        return;
      }

      selectedFile = file;
      previewFilename.textContent = file.name;
      previewFilesize.textContent = formatBytes(file.size);

      dropzone.style.display = 'none';
      filePreview.style.display = 'flex';
      btnConvert.disabled = false;
    }

    function resetSelection() {
      selectedFile = null;
      fileInput.value = '';
      filePreview.style.display = 'none';
      dropzone.style.display = 'block';
      btnConvert.disabled = true;
      progressContainer.style.display = 'none';
      progressBar.style.width = '0%';
    }

    // Convert & Download Handler
    btnConvert.addEventListener('click', async () => {
      if (!selectedFile) return;

      hideAlert();
      btnConvert.disabled = true;
      btnConvert.innerHTML = '<span class="spinner"></span> Converting...';
      progressContainer.style.display = 'block';
      progressBar.style.width = '25%';
      statusText.textContent = 'Uploading PDF...';

      const formData = new FormData();
      formData.append('file', selectedFile);

      try {
        setTimeout(() => {
          progressBar.style.width = '65%';
          statusText.textContent = 'Reconstructing layout, tables & formatting...';
        }, 700);

        const response = await fetch(API_ENDPOINT, {
          method: 'POST',
          body: formData,
        });

        if (!response.ok) {
          let errorMsg = 'Failed to convert document.';
          try {
            const errData = await response.json();
            if (errData && errData.detail) errorMsg = errData.detail;
          } catch (_) {
            errorMsg = `Server error (HTTP ${response.status})`;
          }
          throw new Error(errorMsg);
        }

        progressBar.style.width = '90%';
        statusText.textContent = 'Preparing Word document download...';

        // Extract filename from Content-Disposition header if available
        let downloadName = selectedFile.name.replace(/\.[^/.]+$/, "") + ".docx";
        const disposition = response.headers.get('Content-Disposition');
        if (disposition && disposition.includes('filename=')) {
          const match = disposition.match(/filename="?([^"]+)"?/);
          if (match && match[1]) downloadName = match[1];
        }

        // Receive Binary Stream as Blob
        const blob = await response.blob();
        progressBar.style.width = '100%';
        statusText.textContent = 'Download starting!';

        // Trigger Instant Browser File Download
        const downloadUrl = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = downloadName;
        document.body.appendChild(a);
        a.click();
        a.remove();
        window.URL.revokeObjectURL(downloadUrl);

        showAlert('Conversion complete! Your Word document has downloaded.', 'success');
      } catch (err) {
        showAlert(err.message || 'An unexpected error occurred during conversion.');
      } finally {
        btnConvert.disabled = false;
        btnConvert.innerHTML = '<span>Convert to Word (.docx)</span>';
        setTimeout(() => {
          progressContainer.style.display = 'none';
          progressBar.style.width = '0%';
        }, 3500);
      }
    });
  </script>
</body>
</html>
