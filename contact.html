<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us - PDF BOX</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; padding: 40px; max-width: 800px; margin: 0 auto; color: #333; }
    h1 { color: #1a73e8; }
    a { color: #1a73e8; text-decoration: none; }
    a:hover { text-decoration: underline; }
    form { display: flex; flex-direction: column; max-width: 400px; margin-top: 20px; }
    label { margin-top: 15px; font-weight: bold; }
    input, textarea { padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; }
    button { margin-top: 20px; padding: 10px 20px; background-color: #1a73e8; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background-color: #1557b0; }
  </style>
</head>
<body>
  <h1>Contact Us</h1>
  <p>If you have any questions, feedback, or run into issues while using our tools, please feel free to reach out to us!</p>
  
  <form onsubmit="event.preventDefault(); alert('Message sent! We will get back to you shortly.');">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" required>
    
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>
    
    <label for="message">Message</label>
    <textarea id="message" name="message" rows="5" required></textarea>
    
    <button type="submit">Send Message</button>
  </form>
  
  <br><br>
  <a href="index.html">&larr; Back to PDF BOX</a>
</body>
</html>
